<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>卓球ノート (Table Tennis Note)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    
    /* コート＆グリッド全体コンテナ (基準幅430px, 高さ490px) */
    .court-container {
      position: relative;
      width: 430px;
      height: 490px;
      margin: 0 auto;
      background-color: #0f172a;
    }
    
    /* 卓球台本体 */
    .table-body {
      position: absolute;
      top: 15px;
      left: 65px;
      width: 300px;
      height: 280px;
      background-color: #0c4a6e;
      border: 4px solid #ffffff;
      box-sizing: border-box;
    }
    .table-center-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background-color: #ffffff;
      transform: translateX(-50%);
    }
    .table-net-line {
      position: absolute;
      top: 50%;
      left: -12px;
      right: -12px;
      height: 6px;
      background-color: rgba(255, 255, 255, 0.9);
      border-top: 1px dashed #94a3b8;
      border-bottom: 1px dashed #94a3b8;
      transform: translateY(-50%);
      z-index: 10;
    }

    /* コート外手前エリア */
    .out-body {
      position: absolute;
      top: 300px;
      left: 0;
      width: 430px;
      height: 180px;
      border: 1px dashed #475569;
      border-top: none;
      background-color: rgba(15, 23, 42, 0.6);
      box-sizing: border-box;
    }

    /* 点（グリッドポイント）ボタン */
    .grid-point {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #38bdf8;
      border: 2px solid #ffffff;
      cursor: pointer;
      z-index: 30;
      transition: transform 0.15s, background-color 0.15s;
    }
    .grid-point:hover, .grid-point.active {
      background-color: #ef4444;
      transform: scale(1.4);
      box-shadow: 0 0 10px #ef4444;
    }

    /* スマホなどの小画面向けコート自動縮小ラッパー */
    @media (max-width: 640px) {
      .court-scale-box {
        width: 340px;
        height: 388px;
        position: relative;
        overflow: hidden;
        margin: 0 auto;
      }
      .court-scale-box .court-container {
        transform: scale(0.79);
        transform-origin: top left;
        position: absolute;
        top: 0;
        left: 0;
      }
    }

    /* ドラッグ＆ドロップ（およびタッチ移動中）のスタイル */
    .note-card.dragging {
      opacity: 0.5;
      border: 2px dashed #f97316 !important;
      transform: scale(0.98);
    }
    .note-card.drag-over {
      border-color: #38bdf8 !important;
      background-color: rgba(56, 189, 248, 0.15) !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <!-- ハンバーガーメニュー用サイドドロワー (技術目次) -->
  <div id="sidebar" class="fixed inset-y-0 left-0 w-80 bg-slate-800 border-r border-slate-700 shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 flex flex-col">
    <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
      <div class="flex items-center gap-2">
        <span class="text-xl">🏓</span>
        <h3 class="font-bold text-slate-100">技術目次</h3>
      </div>
      <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-2"><i class="fas fa-times text-lg"></i></button>
    </div>
    <div id="sidebar-content" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
  </div>
  <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden"></div>

  <!-- 拡大詳細モーダル -->
  <div id="detail-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 hidden z-50 overflow-y-auto">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-6 w-full max-w-4xl max-h-[90vh] overflow-y-auto my-auto shadow-2xl relative">
      <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-700/50 hover:bg-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition-colors z-30">
        <i class="fas fa-times text-xl"></i>
      </button>
      <div id="detail-modal-content"></div>
    </div>
  </div>

  <div id="app" class="max-w-5xl mx-auto p-3 sm:p-6">
    <!-- ヘッダー -->
    <header class="flex justify-between items-center mb-6 sm:mb-8 border-b border-slate-700 pb-4">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" id="hamburger-btn" class="hidden text-slate-300 hover:text-white bg-slate-800 border border-slate-700 p-2.5 rounded-lg transition-colors shadow-md">
          <i class="fas fa-bars text-lg"></i>
        </button>
        <div class="flex items-center gap-3 cursor-pointer" onclick="showHome()">
          <div class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center text-white font-bold text-xl shadow-lg">🏓</div>
          <div>
            <h1 class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-red-500 to-blue-400 bg-clip-text text-transparent">卓球ノート</h1>
            <p class="text-[10px] sm:text-xs text-slate-400">My Table Tennis Strategy & Tech Note</p>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="edit-mode-btn" onclick="toggleEditMode()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-medium px-3 py-2 sm:px-4 sm:py-2 text-sm rounded-lg flex items-center gap-2 shadow-md transition-all">
          <i class="fas fa-edit"></i> <span id="edit-mode-text">編集</span>
        </button>
        <button onclick="openModal()" class="bg-red-600 hover:bg-red-500 text-white font-medium px-3 py-2 sm:px-4 sm:py-2 text-sm rounded-lg flex items-center gap-2 shadow-md transition-all">
          <i class="fas fa-plus"></i> 新規追加
        </button>
      </div>
    </header>

    <main id="main-content"></main>
  </div>

  <!-- 新規追加/編集モーダル -->
  <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 hidden z-50 overflow-y-auto">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 sm:p-6 w-full max-w-4xl max-h-[90vh] overflow-y-auto my-auto shadow-2xl">
      <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
        <h3 id="modal-title" class="text-lg sm:text-xl font-bold text-slate-100">ノートを追加</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
      </div>
      
      <form id="note-form" onsubmit="saveNote(event)">
        <input type="hidden" id="note-id">
        
        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-300 mb-1">カテゴリー</label>
          <select id="note-category" onchange="toggleCategoryFields()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-sm focus:outline-none focus:border-red-500" required>
            <option value="tech">自分の持っている技術</option>
            <option value="pattern">システム構築</option>
            <option value="theory">卓球理論</option>
            <option value="equipment">使用用具</option>
          </select>
        </div>

        <!-- 卓球理論専用テーマ選択 -->
        <div id="theory-special-fields" class="mb-4 bg-slate-900/80 p-4 rounded-xl border border-slate-700 hidden">
          <label class="block text-xs font-bold text-blue-400 mb-1"><i class="fas fa-brain mr-1"></i> 理論の分類テーマ</label>
          <select id="theory-sub-category" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-xs text-slate-100">
            <option value="control">１. 領域制御理論</option>
            <option value="mind">２. ペン粒思考</option>
            <option value="reference">３. 今までに参考にしてきたもの</option>
          </select>
        </div>

        <!-- 技術用フィールド（5項目） -->
        <div id="tech-special-fields" class="grid grid-cols-1 md:grid-cols-12 gap-4 sm:gap-6 mb-6">
          <div class="md:col-span-4 bg-slate-900/80 p-3 sm:p-4 rounded-xl border border-slate-700 space-y-3">
            <h4 class="text-sm font-bold text-red-400 border-b border-slate-700 pb-2 mb-2"><i class="fas fa-filter mr-1"></i> 5つの基本項目</h4>
            <div>
              <label class="block text-xs text-slate-400 mb-1">① 利き手</label>
              <select id="tech-hand" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm">
                <option value="右手">右手</option>
                <option value="左手">左手</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">② グリップ</label>
              <select id="tech-grip" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm">
                <option value="ペン">ペン</option>
                <option value="シェーク">シェーク</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">③ ラバー種類</label>
              <select id="tech-surface" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm">
                <option value="裏ソフト">裏ソフト</option>
                <option value="粒高">粒高</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">④ 使用面</label>
              <select id="tech-side" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm">
                <option value="フォア">フォア</option>
                <option value="バック">バック</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">⑤ ポジション</label>
              <select id="tech-position" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm">
                <option value="台上">台上</option>
                <option value="前陣">前陣</option>
                <option value="中陣">中陣</option>
                <option value="後陣">後陣</option>
              </select>
            </div>
          </div>

          <div class="md:col-span-8 bg-slate-900/80 p-3 sm:p-4 rounded-xl border border-slate-700 flex flex-col justify-between items-center">
            <div class="w-full">
              <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-2">
                <h4 class="text-sm font-bold text-blue-400"><i class="fas fa-map-marker-alt mr-1"></i> コース矢印設定</h4>
                <button type="button" onclick="clearCourseArrows()" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-300">クリア</button>
              </div>
              <p class="text-xs text-slate-400 mb-3">点をタップして起点と終点を選び矢印を設定してください</p>
            </div>

            <div class="w-full flex justify-center overflow-x-auto py-1">
              <div class="court-scale-box">
                <div class="court-container rounded overflow-hidden shadow-inner">
                  <div class="table-body">
                    <div class="table-center-line"></div>
                    <div class="table-net-line"></div>
                  </div>
                  <div class="out-body"></div>
                  <svg id="court-svg" class="absolute inset-0 w-full h-full pointer-events-none z-20"></svg>
                  <div id="points-layer" class="absolute inset-0 pointer-events-auto"></div>
                </div>
              </div>
            </div>

            <div class="w-full flex justify-between text-[10px] text-slate-400 mt-2 px-2">
              <span>▲ 相手台内(5x4)</span>
              <span>ネット(5x1) / 自分台内(5x4)</span>
              <span>手前(7x3) ▼</span>
            </div>

            <div id="course-list-text" class="w-full text-xs text-slate-300 mt-2 bg-slate-800 p-2 rounded min-h-[32px]">
              選択中のコース: なし
            </div>
          </div>
        </div>

        <!-- システム構築用フィールド -->
        <div id="pattern-special-fields" class="bg-slate-900/80 p-3 sm:p-4 rounded-xl border border-slate-700 mb-6 hidden">
          <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-3">
            <h4 id="pattern-action-title" class="text-sm font-bold text-orange-400"><i class="fas fa-route mr-1"></i> 連続ラリーのシーン作成</h4>
            <div class="flex gap-2">
              <button type="button" id="pattern-cancel-edit-btn" onclick="cancelSceneEdit()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-slate-300 hidden">編集をキャンセル</button>
              <button type="button" id="pattern-submit-btn" onclick="savePatternScene()" class="text-xs bg-orange-600 hover:bg-orange-500 px-3 py-1.5 rounded text-white font-medium flex items-center gap-1">
                <i class="fas fa-plus"></i> このシーンを追加
              </button>
            </div>
          </div>
          <p id="pattern-guide-text" class="text-xs text-slate-400 mb-3">1球ごとに「起点→終点」を選び、説明文を入れて追加していくことで連続シーンを作れます。</p>

          <div class="grid grid-cols-1 md:grid-cols-12 gap-4 sm:gap-6 mb-4">
            <div class="md:col-span-6 flex flex-col items-center">
              <div class="w-full flex justify-center overflow-x-auto py-1">
                <div class="court-scale-box">
                  <div class="court-container rounded overflow-hidden shadow-inner">
                    <div class="table-body">
                      <div class="table-center-line"></div>
                      <div class="table-net-line"></div>
                    </div>
                    <div class="out-body"></div>
                    <svg id="pattern-court-svg" class="absolute inset-0 w-full h-full pointer-events-none z-20"></svg>
                    <div id="pattern-points-layer" class="absolute inset-0 pointer-events-auto"></div>
                  </div>
                </div>
              </div>
              <button type="button" onclick="clearPatternCurrentArrow()" class="mt-2 text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-slate-300">現在の矢印をリセット</button>
            </div>
            
            <div class="md:col-span-6 flex flex-col justify-between">
              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">現在のシーンの説明文</label>
                <textarea id="pattern-scene-desc" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-slate-100 focus:outline-none focus:border-orange-500" placeholder="例: 浅いツッツキに対してフォア強打"></textarea>
              </div>
              <div class="mt-4 bg-slate-800 p-3 rounded-lg border border-slate-700 flex-1 overflow-y-auto max-h-40">
                <span class="text-xs font-bold text-slate-400 block mb-2">作成済みのシーン一覧:</span>
                <div id="pattern-scenes-list" class="space-y-2 text-xs">
                  <span class="text-slate-500">シーンがまだ追加されていません</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 使用用具用フィールド -->
        <div id="equipment-special-fields" class="bg-slate-900/80 p-4 rounded-xl border border-slate-700 mb-6 hidden space-y-4">
          <h4 class="text-sm font-bold text-purple-400 border-b border-slate-700 pb-2"><i class="fas fa-sliders mr-1"></i> 用具のスペック・性能値（任意入力）</h4>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-slate-400 mb-1">メーカー名</label>
              <input type="text" id="eq-maker" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-xs" placeholder="例: WRM, TIBHAR, BUTTERFLY">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">定価 / 参考価格</label>
              <input type="text" id="eq-price" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-xs" placeholder="例: ¥6,800, オープン価格">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">スピード性能 (0〜10)</label>
              <input type="number" step="0.5" min="0" max="10" id="eq-speed" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-xs" placeholder="例: 8.5">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">スピン・変化値 (0〜10)</label>
              <input type="number" step="0.5" min="0" max="10" id="eq-spin" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-xs" placeholder="例: 9.0">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">コントロール / 硬度</label>
              <input type="text" id="eq-control" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-xs" placeholder="例: 47.5度, 抑えやすさA">
            </div>
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-300 mb-1" id="title-label">技術名</label>
          <input type="text" id="note-title" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-sm focus:outline-none focus:border-red-500" required placeholder="例: フォアドライブ">
        </div>
        
        <div class="mb-6">
          <label class="block text-sm font-medium text-slate-300 mb-1" id="content-label">詳細・メモ（打法・ポイント）</label>
          <textarea id="note-content" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-sm focus:outline-none focus:border-red-500" required placeholder="ポイントや戦術のコツを入力..."></textarea>
        </div>
        
        <div class="flex justify-end gap-3">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium">キャンセル</button>
          <button type="submit" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg text-sm font-medium shadow-md">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const categories = [
      { id: 'tech', name: '自分の持っている技術', icon: 'fa-ping-pong-paddle-ball', color: 'from-red-500 to-rose-600', desc: '5つの項目から絞り込み検索。一覧表示と技術目次で確認' },
      { id: 'pattern', name: 'システム構築', icon: 'fa-diagram-project', color: 'from-orange-500 to-amber-600', desc: '連続するラリーやコース取りの流れ' },
      { id: 'theory', name: '卓球理論', icon: 'fa-brain', color: 'from-blue-500 to-indigo-600', desc: '領域制御理論・ペン粒思考・参考にしている理論など' },
      { id: 'equipment', name: '使用用具', icon: 'fa-sliders', color: 'from-purple-500 to-violet-600', desc: 'ラケット、ラバーの組み合わせと用具の特徴' }

      { id: 'reference', name: '3. 今までに参考にしてきたもの', desc: '動画、講習会、プロの試合、他選手から学んだ知見', icon: 'fa-book-bookmark', color: 'from-emerald-600 to-teal-600' }

        eqMaker: 'TIBHAR',

        eqSpin: 9.8, 
        eqControl: '変化大 (要熟練)',
        updatedAt: '2026-11-06' 
      },
      {

        category: 'theory',

    function getAllPointsCoordinates() {
      const points = [];
      const tableLeft = 65;
      const tableWidth = 300;
      const colX5_actual = [];
      for(let i = 0; i < 5; i++) colX5_actual.push(tableLeft + (tableWidth / 4) * i);
      const colX7_out = [];
      for(let i = 0; i < 7; i++) colX7_out.push(-10 + (450 / 6) * i);

      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 5; c++) points.push({ id: `opp-${r * 5 + c + 1}`, x: colX5_actual[c], y: 15 + r * 36.67 });
      }
      for (let c = 0; c < 5; c++) points.push({ id: `net-${c + 1}`, x: colX5_actual[c], y: 155 });
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 5; c++) points.push({ id: `self-in-${r * 5 + c + 1}`, x: colX5_actual[c], y: 185 + r * 36.67 });
      }
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 7; c++) points.push({ id: `self-out-${r * 7 + c + 1}`, x: colX7_out[c], y: 335 + r * 40 });
      }
      return points;
    }

    function initCourtPoints(prefix = '') {
      const layerId = prefix === 'pattern-' ? 'pattern-points-layer' : 'points-layer';
      const layer = document.getElementById(layerId);
      if (!layer) return;
      const points = getAllPointsCoordinates();
      let html = '';
      points.forEach(p => {
        const clickFn = prefix === 'pattern-' ? `handlePatternPointClick('${p.id}', ${p.x}, ${p.y})` : `handlePointClick('${p.id}', ${p.x}, ${p.y})`;
        html += `<div class="grid-point absolute" data-id="${p.id}" style="left:${p.x - 7}px; top:${p.y - 7}px;" onclick="${clickFn}"></div>`;
      });
      layer.innerHTML = html;
    }

      techFields.classList.add('hidden');

        contentLabel.innerText = '詳細・メモ（打法・ポイント）';

    function handlePointClick(id, x, y) {
      if (!selectedPointStart) {
        selectedPointStart = { id, x, y };
        document.querySelectorAll('#points-layer .grid-point').forEach(el => el.classList.remove('active'));
        const target = document.querySelector(`#points-layer [data-id="${id}"]`);
        if (target) target.classList.add('active');
      } else {
        currentArrows.push({ from: { x: selectedPointStart.x, y: selectedPointStart.y }, to: { x, y } });
        selectedPointStart = null;
        document.querySelectorAll('#points-layer .grid-point').forEach(el => el.classList.remove('active'));
        renderCourtArrows();
      }
    }

    function clearCourseArrows() {
      currentArrows = [];
      selectedPointStart = null;
      document.querySelectorAll('#points-layer .grid-point').forEach(el => el.classList.remove('active'));
      renderCourtArrows();
    }

    function renderCourtArrows() {
      const svg = document.getElementById('court-svg');
      const textContainer = document.getElementById('course-list-text');
      if (!svg) return;
      svg.innerHTML = `<defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444" /></marker></defs>`;
      if (currentArrows.length === 0) {
        if (textContainer) textContainer.innerText = '選択中のコース: なし';
        return;
      }
      let arrowLines = '';
      currentArrows.forEach((arr) => {
        arrowLines += `<line x1="${arr.from.x}" y1="${arr.from.y}" x2="${arr.to.x}" y2="${arr.to.y}" stroke="#ef4444" stroke-width="3.5" marker-end="url(#arrowhead)" />`;
      });
      svg.innerHTML += arrowLines;
      if (textContainer) textContainer.innerText = `選択中のコース: ${currentArrows.length} 本の矢印が登録済み`;
    }

    function handlePatternPointClick(id, x, y) {
      if (!patternSelectedStart) {
        patternSelectedStart = { id, x, y };
        document.querySelectorAll('#pattern-points-layer .grid-point').forEach(el => el.classList.remove('active'));
        const target = document.querySelector(`#pattern-points-layer [data-id="${id}"]`);
        if (target) target.classList.add('active');
      } else {
        patternCurrentArrow = { from: { x: patternSelectedStart.x, y: patternSelectedStart.y }, to: { x, y } };
        patternSelectedStart = null;
        document.querySelectorAll('#pattern-points-layer .grid-point').forEach(el => el.classList.remove('active'));
        renderPatternCurrentArrow();
      }

    function renderPatternCurrentArrow() {
      const svg = document.getElementById('pattern-court-svg');
      if (!svg) return;
      svg.innerHTML = `<defs><marker id="arrowhead-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f97316" /></marker></defs>`;
      if (patternCurrentArrow) {
        svg.innerHTML += `<line x1="${patternCurrentArrow.from.x}" y1="${patternCurrentArrow.from.y}" x2="${patternCurrentArrow.to.x}" y2="${patternCurrentArrow.to.y}" stroke="#f97316" stroke-width="3.5" marker-end="url(#arrowhead-p)" />`;

    function savePatternScene() {
      const desc = document.getElementById('pattern-scene-desc').value.trim();
      if (!patternCurrentArrow) { alert('コート上で矢印を選択してください。'); return; }
      if (!desc) { alert('このシーンの説明文を入力してください。'); return; }

      if (editingSceneIndex !== null) {
        patternScenes[editingSceneIndex] = { arrow: patternCurrentArrow, desc: desc };
        cancelSceneEdit();
      } else {
        patternScenes.push({ arrow: patternCurrentArrow, desc: desc });
        clearPatternCurrentArrow();
        document.getElementById('pattern-scene-desc').value = '';
      }
      renderPatternScenesList();
    }

    function editPatternScene(index) {
      editingSceneIndex = index;
      const scene = patternScenes[index];
      patternCurrentArrow = scene.arrow;
      document.getElementById('pattern-scene-desc').value = scene.desc;
      renderPatternCurrentArrow();
      document.getElementById('pattern-action-title').innerHTML = `<i class="fas fa-pen mr-1"></i> シーン #${index + 1} の編集`;
      document.getElementById('pattern-submit-btn').innerHTML = `<i class="fas fa-check"></i> 更新する`;
      document.getElementById('pattern-cancel-edit-btn').classList.remove('hidden');
    }

    function cancelSceneEdit() {
      editingSceneIndex = null;
      patternCurrentArrow = null;
      document.getElementById('pattern-scene-desc').value = '';
      renderPatternCurrentArrow();
      document.getElementById('pattern-action-title').innerHTML = `<i class="fas fa-route mr-1"></i> 連続ラリーのシーン作成`;
      document.getElementById('pattern-submit-btn').innerHTML = `<i class="fas fa-plus"></i> このシーンを追加`;
      document.getElementById('pattern-cancel-edit-btn').classList.add('hidden');
    }

    function removePatternScene(index) {
      patternScenes.splice(index, 1);
      if (editingSceneIndex === index) cancelSceneEdit();
      else if (editingSceneIndex !== null && editingSceneIndex > index) editingSceneIndex--;
      renderPatternScenesList();
    }

    function updateSidebarAccordion() {
      const container = document.getElementById('sidebar-content');
      const techNotes = notes.filter(n => n.category === 'tech');
      if (techNotes.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">登録されている技術はありません</p>`;
        return;
      }
      const tree = {};
      techNotes.forEach(n => {
        const d = n.techDetails || { hand: '右手', grip: 'ペン', surface: '裏ソフト', side: 'フォア', position: '前陣' };
        const side = d.side || 'フォア';
        if (!tree[d.hand]) tree[d.hand] = {};
        if (!tree[d.hand][d.grip]) tree[d.hand][d.grip] = {};
        if (!tree[d.hand][d.grip][d.surface]) tree[d.hand][d.grip][d.surface] = {};
        if (!tree[d.hand][d.grip][d.surface][side]) tree[d.hand][d.grip][d.surface][side] = {};
        if (!tree[d.hand][d.grip][d.surface][side][d.position]) tree[d.hand][d.grip][d.surface][side][d.position] = [];
        tree[d.hand][d.grip][d.surface][side][d.position].push(n);
      });

      let html = '';
      for (const hand in tree) {
        html += `<div class="border border-slate-700 rounded-lg overflow-hidden bg-slate-900/50">
          <button onclick="toggleAccordionNode(this)" class="w-full flex justify-between items-center p-3 text-sm font-bold text-slate-200 hover:bg-slate-700/50"><span>✋ ${hand}</span><i class="fas fa-chevron-down text-xs transition-transform"></i></button>
          <div class="hidden p-2 pl-3 space-y-2 border-t border-slate-700/50 bg-slate-900/30">`;
        for (const grip in tree[hand]) {
          html += `<div class="border border-slate-700/60 rounded overflow-hidden">
            <button onclick="toggleAccordionNode(this)" class="w-full flex justify-between items-center p-2 text-xs font-bold text-slate-300 hover:bg-slate-700/50"><span>🏓 ${grip}</span><i class="fas fa-chevron-down text-xs transition-transform"></i></button>
            <div class="hidden p-2 pl-3 space-y-2 border-t border-slate-700/50">`;
          for (const surf in tree[hand][grip]) {
            html += `<div class="border border-slate-700/40 rounded overflow-hidden">
              <button onclick="toggleAccordionNode(this)" class="w-full flex justify-between items-center p-2 text-xs font-medium text-slate-300 hover:bg-slate-700/50"><span>🔴 ${surf}</span><i class="fas fa-chevron-down text-xs transition-transform"></i></button>
              <div class="hidden p-2 pl-3 space-y-2 border-t border-slate-700/30">`;
            for (const side in tree[hand][grip][surf]) {
              html += `<div class="border border-slate-700/30 rounded overflow-hidden">
                <button onclick="toggleAccordionNode(this)" class="w-full flex justify-between items-center p-1.5 text-xs font-medium text-orange-300 hover:bg-slate-700/50"><span>🎯 ${side}</span><i class="fas fa-chevron-down text-xs transition-transform"></i></button>
                <div class="hidden p-1.5 pl-3 space-y-1 border-t border-slate-700/20">`;
              for (const pos in tree[hand][grip][surf][side]) {
                html += `<div class="border border-slate-700/20 rounded overflow-hidden">
                  <button onclick="toggleAccordionNode(this)" class="w-full flex justify-between items-center p-1 text-[11px] font-medium text-blue-300 hover:bg-slate-700/50"><span>📍 ${pos}</span><i class="fas fa-chevron-down text-xs transition-transform"></i></button>
                  <div class="hidden p-1 pl-3 space-y-1 border-t border-slate-700/10">`;
                tree[hand][grip][surf][side][pos].forEach(note => {
                  html += `<div onclick="openDetailModal('${note.id}')" class="text-xs text-slate-300 hover:text-red-400 cursor-pointer py-1 truncate">• ${escapeHtml(note.title)}</div>`;
                });
                html += `</div></div>`;
              }
              html += `</div></div>`;
            }
            html += `</div></div>`;
          }
          html += `</div></div>`;
        }
        html += `</div></div>`;
      }
      container.innerHTML = html;
    }

    function resetTechFilter() {
      techFilterStep = { hand: null, grip: null, surface: null, side: null, position: null };
    }

    function setTechFilterStep(stepKey, val) {
      if (stepKey === 'hand') { techFilterStep = { hand: val, grip: null, surface: null, side: null, position: null }; }
      else if (stepKey === 'grip') { techFilterStep.grip = val; techFilterStep.surface = null; techFilterStep.side = null; techFilterStep.position = null; }
      else if (stepKey === 'surface') { techFilterStep.surface = val; techFilterStep.side = null; techFilterStep.position = null; }
      else if (stepKey === 'side') { techFilterStep.side = val; techFilterStep.position = null; }
      else if (stepKey === 'position') { techFilterStep.position = val; }
      renderCategoryView();
    }

    function renderTechSelectionAndList() {
      let html = '';

      const filteredTechNotes = notes.filter(n => {
        if (n.category !== 'tech') return false;
        const d = n.techDetails || { hand: '右手', grip: 'ペン', surface: '裏ソフト', side: 'フォア', position: '前陣' };
        if (techFilterStep.hand && d.hand !== techFilterStep.hand) return false;
        if (techFilterStep.grip && d.grip !== techFilterStep.grip) return false;
        if (techFilterStep.surface && d.surface !== techFilterStep.surface) return false;
        if (techFilterStep.side && (d.side || 'フォア') !== techFilterStep.side) return false;
        if (techFilterStep.position && d.position !== techFilterStep.position) return false;
        return true;
      });

      let nextStepHtml = '';
      if (!techFilterStep.hand) {
        nextStepHtml = `
          <h3 class="text-sm font-bold text-slate-400 mb-3"><i class="fas fa-filter text-red-400 mr-1"></i> ① 利き手を選んでさらに絞り込む</h3>

                <div class="text-base sm:text-lg font-bold text-slate-100">${h}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (!techFilterStep.grip) {

          </div>
          <div class="grid grid-cols-2 gap-3 sm:gap-4 mb-6">
            ${['ペン', 'シェーク'].map(g => `

                <div class="text-base sm:text-lg font-bold text-slate-100">${g}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (!techFilterStep.surface) {
        nextStepHtml = `
          <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-bold text-slate-400"><i class="fas fa-filter text-red-400 mr-1"></i> ③ ラバー種類を選んでさらに絞り込む</h3>
            <button onclick="setTechFilterStep('grip', null)" class="text-xs text-slate-400 hover:text-slate-200">Reset</button>
          </div>
          <div class="grid grid-cols-2 gap-3 sm:gap-4 mb-6">
            ${['裏ソフト', '粒高'].map(s => `
              <div onclick="setTechFilterStep('surface', '${s}')" class="bg-slate-800 border border-slate-700 hover:border-red-500 p-4 rounded-xl cursor-pointer text-center transition-all shadow-md">

            `).join('')}
          </div>

      } else if (!techFilterStep.side) {
        nextStepHtml = `

          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 mb-6">
            ${['台上', '前陣', '中陣', '後陣'].map(p => `
              <div onclick="setTechFilterStep('position', '${p}')" class="bg-slate-800 border border-slate-700 hover:border-red-500 p-4 rounded-xl cursor-pointer text-center transition-all shadow-md">
                <div class="text-base sm:text-lg font-bold text-slate-100">${p}</div>
              </div>
            `).join('')}
          </div>
        `;
      }

      html += nextStepHtml;

      const currentCondText = [
        techFilterStep.hand,
        techFilterStep.grip,
        techFilterStep.surface,
        techFilterStep.side,
        techFilterStep.position
      ].filter(Boolean).join(' ＞ ') || 'すべて';

      html += `
        <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-4">
          <h3 class="text-sm font-bold text-slate-300">
            検索条件: <span class="text-red-400">${currentCondText}</span> 
            <span class="text-xs text-slate-400 ml-2">(${filteredTechNotes.length} 件)</span>
          </h3>
          ${techFilterStep.hand ? `<button onclick="resetTechFilter(); renderCategoryView();" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded text-slate-300">条件を完全クリア</button>` : ''}
        </div>
        <div id="notes-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${renderNotesList(filteredTechNotes)}
        </div>
      `;

      return html;
    }

    function renderNotesList(list) {
      if (list.length === 0) {
        return `<div class="col-span-2 text-center py-12 text-slate-500 bg-slate-800/40 rounded-xl border border-slate-800 text-xs sm:text-sm">該当するノートがありません。「新規追加」から登録してください。</div>`;
      }
      return list.map(n => {
        let displayArrows = n.arrows || [];
        if (displayArrows.length === 0 && n.scenes && n.scenes.length > 0) {
          displayArrows = [n.scenes[0].arrow];
        }

        const draggableAttr = isEditMode ? 'draggable="true"' : '';
        const dragEvents = isEditMode ? `
          ondragstart="onDragStart(event, '${n.id}')" 
          ondragover="onDragOver(event)" 
          ondrop="onDrop(event, '${n.id}')" 
          ondragleave="onDragLeave(event)"
          ontouchstart="onTouchStart(event, '${n.id}')"
          ontouchmove="onTouchMove(event)"
          ontouchend="onTouchEnd(event)"
        ` : '';
        const editBorderClass = isEditMode ? 'border-dashed border-orange-500/80 cursor-grab active:cursor-grabbing' : 'cursor-pointer';

        return `
          <div ${draggableAttr} ${dragEvents} onclick="${isEditMode ? '' : `openDetailModal('${n.id}')`}" class="note-card bg-slate-800/90 border border-slate-700/80 hover:border-red-500/80 rounded-xl p-4 sm:p-5 shadow-lg flex flex-col justify-between transition-all group ${editBorderClass}" data-id="${n.id}">
            <div>
              <div class="flex justify-between items-start mb-2">
                <div class="flex items-center gap-2">
                  ${isEditMode ? `<span class="text-orange-400 text-sm cursor-grab touch-handle"><i class="fas fa-grip-vertical"></i></span>` : ''}
                  <h4 class="text-base sm:text-lg font-bold text-slate-100 group-hover:text-red-400 transition-colors">${escapeHtml(n.title)}</h4>
                </div>
                <div class="flex items-center gap-2" onclick="event.stopPropagation()">
                  ${isEditMode ? `
                    <button onclick="deleteNote('${n.id}')" class="bg-red-600/80 hover:bg-red-500 text-white text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1 shadow-md transition-colors"><i class="fas fa-trash"></i> 削除</button>
                  ` : `
                    <button onclick="editNote('${n.id}')" class="text-slate-400 hover:text-blue-400 text-sm p-1"><i class="fas fa-pen"></i></button>
                  `}
                </div>
              </div>
              
              ${n.techDetails ? `
                <div class="text-xs text-blue-300 bg-slate-900/80 p-2 rounded mb-3 flex flex-wrap gap-2 border border-slate-700/50">
                  <span>✋ ${n.techDetails.hand}</span>
                  <span>🏓 ${n.techDetails.grip}</span>
                  <span>🔴 ${n.techDetails.surface}</span>
                  <span>🎯 ${n.techDetails.side || 'フォア'}</span>
                  <span>📍 ${n.techDetails.position}</span>
                </div>
              ` : ''}

              ${n.category === 'pattern' ? `<div class="text-[10px] text-orange-400 font-bold mb-1">システム構築 (${n.scenes ? n.scenes.length : 0}シーン)</div>` : ''}
              ${n.category === 'equipment' ? `<div class="text-[10px] text-purple-400 font-bold mb-1">メーカー: ${escapeHtml(n.eqMaker || '未設定')}</div>` : ''}
              ${n.category === 'theory' ? `<div class="text-[10px] text-blue-400 font-bold mb-1">分類: ${(theorySubCategories.find(s=>s.id===(n.theorySub||'control'))||{}).name || '領域制御理論'}</div>` : ''}

              ${displayArrows.length > 0 ? renderDisplayCourt(displayArrows) : ''}

              <p class="text-slate-300 text-xs sm:text-sm line-clamp-2 leading-relaxed mb-4">${escapeHtml(n.content)}</p>
            </div>
            <div class="flex justify-between items-center text-[11px] sm:text-xs text-slate-500 border-t border-slate-700/50 pt-3">
              <span>更新日: ${n.updatedAt}</span>
              <span class="text-red-400 font-medium">${isEditMode ? 'ドラッグして並び替え' : '詳細を見る →'}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    /* PC用ドラッグ＆ドロップ */
    function onDragStart(e, id) {
      draggedNoteId = id;
      e.target.classList.add('dragging');
    }
    function onDragOver(e) {
      e.preventDefault();
      const card = e.target.closest('.note-card');
      if (card) card.classList.add('drag-over');
    }
    function onDragLeave(e) {
      const card = e.target.closest('.note-card');
      if (card) card.classList.remove('drag-over');
    }
    function onDrop(e, targetId) {
      e.preventDefault();
      const card = e.target.closest('.note-card');
      if (card) card.classList.remove('drag-over');

      if (!draggedNoteId || draggedNoteId === targetId) return;
      reorderNotes(draggedNoteId, targetId);
      draggedNoteId = null;
    }

    /* スマホタッチ操作用並び替え処理 */
    let touchDraggedEl = null;
    let touchTargetId = null;

    function onTouchStart(e, id) {
      if (!isEditMode) return;
      draggedNoteId = id;
      touchDraggedEl = e.currentTarget;
      touchDraggedEl.classList.add('dragging');
    }

    function onTouchMove(e) {
      if (!draggedNoteId || !touchDraggedEl) return;
      
      const touch = e.touches[0];
      const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
      const card = targetEl ? targetEl.closest('.note-card') : null;

      document.querySelectorAll('.note-card').forEach(c => c.classList.remove('drag-over'));

      if (card && card !== touchDraggedEl) {
        card.classList.add('drag-over');
        touchTargetId = card.getAttribute('data-id');
      } else {
        touchTargetId = null;
      }
    }

    function onTouchEnd(e) {
      if (!draggedNoteId) return;

      if (touchDraggedEl) touchDraggedEl.classList.remove('dragging');
      document.querySelectorAll('.note-card').forEach(c => c.classList.remove('drag-over'));

      if (touchTargetId && draggedNoteId !== touchTargetId) {
        reorderNotes(draggedNoteId, touchTargetId);
      }

      draggedNoteId = null;
      touchDraggedEl = null;
      touchTargetId = null;
    }

    /* 配列の並び替え実行共通処理 */
    function reorderNotes(fromId, toId) {
      const fromIdx = notes.findIndex(n => n.id === fromId);
      const toIdx = notes.findIndex(n => n.id === toId);

      if (fromIdx !== -1 && toIdx !== -1) {
        const [moved] = notes.splice(fromIdx, 1);
        notes.splice(toIdx, 0, moved);
        saveToStorage();
        renderCategoryView();
      }
    }

    function filterNotes() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const container = document.getElementById('notes-container');
      if (!container) return;
      
      let list = notes.filter(n => n.category === currentCategory);
      if (currentCategory === 'theory' && currentTheorySub) {
        list = list.filter(n => (n.theorySub || 'control') === currentTheorySub);
      } else if (currentCategory === 'tech') {
        list = list.filter(n => {
          const d = n.techDetails || { hand: '右手', grip: 'ペン', surface: '裏ソフト', side: 'フォア', position: '前陣' };
          if (techFilterStep.hand && d.hand !== techFilterStep.hand) return false;
          if (techFilterStep.grip && d.grip !== techFilterStep.grip) return false;
          if (techFilterStep.surface && d.surface !== techFilterStep.surface) return false;
          if (techFilterStep.side && (d.side || 'フォア') !== techFilterStep.side) return false;
          if (techFilterStep.position && d.position !== techFilterStep.position) return false;
          return true;
        });
      }
      list = list.filter(n => n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q));
      container.innerHTML = renderNotesList(list);
    }

    function openModal(editId = null) {
      document.getElementById('modal').classList.remove('hidden');
      clearCourseArrows();
      patternScenes = [];
      patternCurrentArrow = null;
      cancelSceneEdit();
      renderPatternScenesList();
      renderPatternCurrentArrow();
      
      if (editId) {
        const n = notes.find(item => item.id === editId);
        document.getElementById('modal-title').innerText = 'ノートを編集';
        document.getElementById('note-id').value = n.id;
        document.getElementById('note-category').value = n.category;
        document.getElementById('note-title').value = n.title;
        document.getElementById('note-content').value = n.content;
        
        if (n.category === 'tech') {
          if (n.techDetails) {
            document.getElementById('tech-hand').value = n.techDetails.hand || '右手';
            document.getElementById('tech-grip').value = n.techDetails.grip || 'ペン';
            document.getElementById('tech-surface').value = n.techDetails.surface || '裏ソフト';
            document.getElementById('tech-side').value = n.techDetails.side || 'フォア';
            document.getElementById('tech-position').value = n.techDetails.position || '前陣';
          }
          if (n.arrows) { currentArrows = [...n.arrows]; renderCourtArrows(); }
        } else if (n.category === 'pattern') {
          if (n.scenes) { patternScenes = [...n.scenes]; renderPatternScenesList(); }
        } else if (n.category === 'equipment') {
          document.getElementById('eq-maker').value = n.eqMaker || '';
          document.getElementById('eq-price').value = n.eqPrice || '';
          document.getElementById('eq-speed').value = n.eqSpeed || '';
          document.getElementById('eq-spin').value = n.eqSpin || '';
          document.getElementById('eq-control').value = n.eqControl || '';
        } else if (n.category === 'theory') {
          document.getElementById('theory-sub-category').value = n.theorySub || 'control';
        }
      } else {
        document.getElementById('modal-title').innerText = 'ノートを追加';
        document.getElementById('note-form').reset();
        document.getElementById('note-id').value = '';
        if (currentCategory) document.getElementById('note-category').value = currentCategory;
      }
      toggleCategoryFields();
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function saveNote(e) {
      e.preventDefault();
      const id = document.getElementById('note-id').value;
      const category = document.getElementById('note-category').value;
      const title = document.getElementById('note-title').value;
      const content = document.getElementById('note-content').value;
      const now = new Date().toISOString().split('T')[0];

      let techDetails = null;
      let arrows = null;
      let scenes = null;
      let eqMaker = null, eqPrice = null, eqSpeed = null, eqSpin = null, eqControl = null;
      let theorySub = null;

      if (category === 'tech') {
        techDetails = {
          hand: document.getElementById('tech-hand').value,
          grip: document.getElementById('tech-grip').value,
          surface: document.getElementById('tech-surface').value,
          side: document.getElementById('tech-side').value,
          position: document.getElementById('tech-position').value
        };
        arrows = [...currentArrows];
      } else if (category === 'pattern') {
        if (patternScenes.length === 0) { alert('システム構築のシーンを少なくとも1つ追加してください。'); return; }
        scenes = patternScenes;
      } else if (category === 'equipment') {
        eqMaker = document.getElementById('eq-maker').value;
        eqPrice = document.getElementById('eq-price').value;
        eqSpeed = document.getElementById('eq-speed').value;
        eqSpin = document.getElementById('eq-spin').value;
        eqControl = document.getElementById('eq-control').value;
      } else if (category === 'theory') {
        theorySub = document.getElementById('theory-sub-category').value;
      }

      const noteObj = { id: id || Date.now().toString(), category, theorySub, title, techDetails, arrows, scenes, eqMaker, eqPrice, eqSpeed, eqSpin, eqControl, content, updatedAt: now };

      if (id) {
        const index = notes.findIndex(n => n.id === id);
        notes[index] = noteObj;
      } else {
        notes.unshift(noteObj);
      }

      saveToStorage();
      closeModal();
      showCategory(currentCategory);
    }

    function editNote(id) { openModal(id); }
    function deleteNote(id) {
      if (confirm('このノートを削除しますか？')) {
        notes = notes.filter(n => n.id !== id);
        saveToStorage();
        renderCategoryView();
      }
    }
    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    showHome();
  </script>
</body>
</html>
